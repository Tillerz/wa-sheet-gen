<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WA Sheet Generator</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">WA Sheet Generator</div>
    <nav class="actions">
      <button id="btnNew" type="button">New</button>
      <button id="btnOpen" type="button">Open…</button>
      <button id="btnSave" type="button" class="primary">Save</button>
      <button id="btnSaveAs" type="button">Save as…</button>
      <span class="bar-sep"></span>
      <button id="btnUndo" type="button" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
      <button id="btnRedo" type="button" title="Redo (Ctrl+Y)" disabled>↷ Redo</button>
      <span class="bar-sep"></span>
      <button id="btnCheck" type="button" title="Check the sheet against the WA rules">Check</button>
      <button id="btnExport" type="button" class="primary" title="Save, then write the five WA files into the project folder">Export</button>
    </nav>
    <div class="doc-title" id="docTitle"></div>
  </header>

  <main class="workspace">
    <aside class="palette">
      <h2>Layout</h2>
      <div class="palette-item" draggable="true" data-type="row"><span class="pi-icon">▭</span>Row</div>
      <div class="palette-item" draggable="true" data-type="col"><span class="pi-icon">▯</span>Col</div>
      <div class="palette-item" draggable="true" data-type="card"><span class="pi-icon">▤</span>Card</div>
      <h2>Content</h2>
      <div class="palette-item" draggable="true" data-type="text"><span class="pi-icon">T</span>Text</div>
      <div class="palette-item" draggable="true" data-type="ul"><span class="pi-icon">•</span>Bullet list</div>
      <div class="palette-item" draggable="true" data-type="ol"><span class="pi-icon">1.</span>Numbered list</div>
      <div class="palette-item" draggable="true" data-type="table"><span class="pi-icon">▦</span>Table</div>
      <div class="palette-item" draggable="true" data-type="image"><span class="pi-icon">▣</span>Image</div>
      <h2>Fields</h2>
      <div class="palette-item" draggable="true" data-type="field:string"><span class="pi-icon">Aa</span>String</div>
      <div class="palette-item" draggable="true" data-type="field:number"><span class="pi-icon">#</span>Number</div>
      <div class="palette-item" draggable="true" data-type="field:text"><span class="pi-icon">¶</span>Text area</div>
      <div class="palette-item" draggable="true" data-type="field:checkbox"><span class="pi-icon">☑</span>Checkbox</div>
      <div class="palette-item" draggable="true" data-type="field:select"><span class="pi-icon">▾</span>Dropdown</div>
      <div class="palette-item" draggable="true" data-type="field:suggest"><span class="pi-icon">⌕</span>Suggest</div>
      <div class="palette-item" draggable="true" data-type="field:image"><span class="pi-icon">▣</span>Image ID</div>
      <p class="hint">Drag an element into the sheet. It can only land where it is allowed.</p>
    </aside>
    <section class="canvas-wrap">
      <div class="canvas-bar">
        <div class="segmented" id="bpSwitch" title="Screen size: sets the canvas width and which col width you change">
          <button type="button" data-bp="col">All sizes</button>
          <button type="button" data-bp="md">Medium</button>
          <button type="button" data-bp="lg" class="active">Large</button>
        </div>
      </div>
      <div class="canvas-scroll">
        <iframe id="canvas" src="canvas.html" title="Sheet canvas"></iframe>
      </div>
    </section>
    <aside class="panel">
      <h2>Sheet</h2>
      <label class="field">
        <span>Sheet name</span>
        <input id="sheetName" type="text" spellcheck="false" autocomplete="off">
      </label>
      <p class="error" id="sheetNameErr"></p>
      <p class="hint">Root class: <code id="rootClass"></code></p>

      <h2>Selection</h2>
      <div id="selection"></div>

      <h2>Project folder</h2>
      <p class="path" id="folderPath"></p>
    </aside>
  </main>

  <dialog id="folderDlg">
    <div class="dlg">
      <h3 id="dlgTitle"></h3>
      <div class="dlg-path">
        <button type="button" id="dlgUp" title="Up one folder">↑</button>
        <input id="dlgPath" type="text" spellcheck="false">
      </div>
      <div class="dlg-drives" id="dlgDrives"></div>
      <ul class="dlg-list" id="dlgList"></ul>
      <label class="field" id="dlgNewWrap">
        <span>New folder name (optional)</span>
        <input id="dlgNew" type="text" spellcheck="false" autocomplete="off">
      </label>
      <p class="hint" id="dlgHint"></p>
      <div class="dlg-buttons">
        <button type="button" id="dlgCancel">Cancel</button>
        <button type="button" id="dlgOk" class="primary"></button>
      </div>
    </div>
  </dialog>

  <dialog id="probDlg">
    <div class="dlg">
      <h3 id="probTitle"></h3>
      <ul class="prob-list" id="probList"></ul>
      <div class="dlg-buttons">
        <button type="button" id="probClose" class="primary">Close</button>
      </div>
    </div>
  </dialog>

  <div id="ctxMenu" class="menu" hidden></div>

  <div id="toast" role="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
